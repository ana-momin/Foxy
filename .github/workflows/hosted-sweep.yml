# Hosted mode's clock.
#
# The sweep runs HERE, not behind an HTTP call to the web app. A full pass over
# five sources takes minutes, and a serverless function is killed long before
# that: calling /internal/sweep returned FUNCTION_INVOCATION_TIMEOUT after five
# minutes. The runner has hours, and can reach Postgres and Slack directly.
#
# Repository secrets required:
#   DATABASE_URL     the same Postgres the web app uses
#   ENCRYPTION_KEY   must match the web app, or stored tokens will not decrypt
#
# Optional, and shared across every workspace that has not set its own:
#   SERPER_API_KEY, ANTHROPIC_API_KEY

name: Hosted sweep

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sweep, or doctor to check every workspace against Slack"
        type: choice
        default: sweep
        options: [sweep, doctor, doctor-post, repair, audit-early, audit-early-fix]

concurrency:
  group: hosted-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only for the keepalive step below; the sweep itself writes to Postgres,
    # not to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Sweep every installed workspace
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY:    ${{ secrets.ENCRYPTION_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$ENCRYPTION_KEY" ]; then
            echo "DATABASE_URL and ENCRYPTION_KEY must be set as repository secrets."
            exit 1
          fi
          # doctor exits 1 when it FINDS a problem, which is right for a
          # command a person reads and wrong for a job a person gets mailed
          # about: a workspace that never chose a channel is a known fact, not
          # a broken run. The report still prints the count. Only the sweep
          # itself, and a repair that could not complete, turn the run red.
          case "${{ inputs.mode || 'sweep' }}" in
            doctor)      python -m app.cli hosted-doctor || true ;;
            doctor-post) python -m app.cli hosted-doctor --post || true ;;
            repair)      python -m app.cli hosted-repair ;;
            audit-early) python -m app.cli audit-early ;;
            audit-early-fix) python -m app.cli audit-early --fix ;;
            *)           python -m app.cli hosted-sweep ;;
          esac

      # GitHub switches a scheduled workflow off after 60 days with no commits
      # to the repository, sends one email about it, and waits to be turned back
      # on by hand. For a monitor that is supposed to run for years after anyone
      # last touched the code, that is a silent stop with a timer on it.
      #
      # So the sweep keeps its own clock wound: when the newest commit is old
      # enough to be worth worrying about, push one that changes nothing. The
      # [skip ci] marker keeps it from starting a test run nobody asked for, and
      # a failure here must never fail a sweep that already did its work.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "newest commit is $age days old"
          if [ "$age" -ge 45 ]; then
            git config user.name  "foxy"
            git config user.email "foxy@users.noreply.github.com"
            git commit --allow-empty -m "Keep the sweep schedule alive [skip ci]"
            git push || echo "push did not land; the next sweep will try again"
          fi

      # Runs after the keepalive, so a renewal that just happened is the date
      # the console shows. An automatic renewal nobody can see is impossible to
      # tell apart from one that has quietly stopped working.
      - name: Report the schedule's remaining life
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python -m app.cli note-commit
